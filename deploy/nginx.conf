server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;

    add_header X-Content-Type-Options nosniff always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /konradkunkel {
        return 308 /konradkunkel/;
    }

    location /konradkunkel/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /konradkunkel/ {
        try_files $uri $uri/ /konradkunkel/index.html;
    }

    location / {
        return 404;
    }
}
